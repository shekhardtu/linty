[package]
name = "linty"
version = "0.0.1"
description = "Privacy-first dictation for macOS with offline Whisper and Parakeet"
authors = ["Hari Shekhar"]
license = "MIT"
repository = "https://github.com/shekhardtu/linty"
homepage = "https://linty.ai"
edition = "2021"

[lib]
name = "linty_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "~2.11.0" # configure_client follows the plugin's HTTP client API
tauri-plugin-process = "2"
tauri-plugin-log = "2"   # local-only rotating log file (src/logging.rs)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
time = { version = "0.3", features = ["formatting", "macros"] }   # log line timestamps (src/logging.rs)
cpal = "0.15"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
base64 = "0.22"          # app icons as data URLs
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }

# CPU inference is available on both Mac architectures.
whisper-rs = { version = "0.15", optional = true }
hound = { version = "3.5", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled", "blob"] }
tauri-plugin-dialog = "2"
anyhow = "1"
candle-core = "=0.11.0"
candle-transformers = "=0.11.0"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
sha2 = "0.11"
tempfile = "3"
whatlang = "0.18"

# macOS-only dependencies
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"          # NSEvent monitoring for fn/globe key
block2 = "0.5"
cocoa = "0.27"          # Activation policy (Dock/menu bar)
objc = "0.2"
security-framework = "3.7"

# Intel Macs use CPU inference. Metal kernels are built only for Apple silicon.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "0.15", features = ["metal"], optional = true }
candle-core = { version = "=0.11.0", features = ["metal"] }
candle-transformers = { version = "=0.11.0", features = ["metal"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
local-stt = ["whisper-rs", "hound"]
# Parakeet TDT v3 on the Neural Engine via the Swift bridge in swift/ (see build.rs).
# Apple silicon only; Intel builds expose an unsupported backend and use Whisper.
# Needs Xcode 16+; SwiftPM fetches FluidAudio on the first build.
parakeet = ["local-stt"]

# The engine benchmark links both local engines; Cargo skips it otherwise.
[[example]]
name = "stt_bench"
required-features = ["local-stt", "parakeet"]

[[example]]
name = "stt_capacity"
required-features = ["local-stt", "parakeet"]

[[example]]
name = "stt_guards"
required-features = ["local-stt", "parakeet"]

[[example]]
name = "dictation_eval"
required-features = ["local-stt", "parakeet"]

[[example]]
name = "corpus_eval"
required-features = ["local-stt", "parakeet"]

[dev-dependencies]
libc = "0.2"
# Mock runtime for tests/logging_smoke.rs; test builds only.
tauri = { version = "2", features = ["test"] }

[lints.rust]
unexpected_cfgs = "allow"
