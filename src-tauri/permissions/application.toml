# Application commands are denied unless the window has the corresponding permission.
[[permission]]
identifier = "main-commands"
description = "Manage dictation, models, and local history from the main window."
commands.allow = [
    "check_for_update",
    "start_dictation",
    "stop_dictation",
    "dictation_result",
    "s1_model_status",
    "download_s1_model",
    "prepare_s1_model",
    "unload_s1_model",
    "cancel_reformatting",
    "history_snapshot",
    "history_query",
    "history_get",
    "history_patch",
    "history_delete",
    "history_restore",
    "history_clear",
    "history_retention_preview",
    "history_set_retention",
    "history_usage",
    "history_usage_summary",
    "history_corrections",
    "history_add_correction",
    "history_export",
    "history_set_save_audio",
    "history_audio",
    "history_delete_audio",
    "history_export_audio",
    "get_audio_inputs",
    "set_audio_input",
    "recover_recording",
    "stop_correction_watch",
    "check_accessibility",
    "request_accessibility",
    "reinit_fn_key_monitor",
    "force_reinit_fn_key_monitor",
    "check_fn_key_conflict",
    "set_trigger_modifier",
    "open_system_settings",
    "check_microphone",
    "request_microphone",
    "get_app_icons",
    "get_available_models",
    "get_theme",
    "get_models_dir",
    "check_model_exists",
    "download_model_file",
    "delete_model_file",
    "is_local_stt_available",
    "set_model_idle_unload_minutes",
    "load_local_model",
    "prepare_dictation",
    "prepare_parakeet_vocabulary",
    "reset_all_data",
    "show_capsule",
    "hide_capsule",
    "emit_capsule_state",
    "show_correction_feedback",
    "play_capsule_sound",
]

[[permission]]
identifier = "capsule-commands"
description = "Show and dismiss the recording overlay."
commands.allow = ["show_capsule", "hide_capsule", "get_theme"]
