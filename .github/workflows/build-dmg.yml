name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: Require every older copy to install this release
        type: boolean
        default: false
      build_only:
        description: Build and test without publishing (measure warm caches)
        type: boolean
        default: false
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checked-source:
    name: Check for successful PR validation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reused: ${{ steps.previous-checks.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the PR tested the same source tree
        id: previous-checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/reuse-pr-checks.mjs

  checks:
    needs: checked-source
    if: needs.checked-source.outputs.reused != 'true'
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build-macos:
    # Build concurrently with validation. Publication also requires either a
    # matching successful PR suite or a fresh successful suite.
    runs-on: macos-14 # Apple Silicon (M1) runner
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      LINTY_PARAKEET_LIB_DIR: ${{ github.workspace }}/src-tauri/swift/.build/ci-prebuilt

    # Skip CI when commit message contains [skip ci]
    if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — Node 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prepare release version
        id: version
        env:
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          ARGS=()
          if [ "$BUILD_ONLY" = "true" ]; then ARGS+=(--build-only); fi
          VERSION=$(node scripts/prepare-release.mjs "${ARGS[@]}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: release v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select Xcode (Swift 6 toolchain for the Parakeet bridge)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Native checks use the same exact archive key and build recipe.
      - name: Restore or build Swift bridge
        uses: ./.github/actions/swift-bridge

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: macos-universal
          cache-on-failure: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 — Node 24
        with:
          node-version: 24
          cache: yarn

      - name: Install yarn dependencies
        run: yarn install --frozen-lockfile

      - name: Verify the versioned release source
        run: |
          yarn test
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features local-stt,parakeet

      - name: Import Apple certificate
        env:
          LINTY_APPLE_SIGNING_CERTIFICATE: ${{ secrets.LINTY_APPLE_SIGNING_CERTIFICATE }}
          LINTY_APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.LINTY_APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          # Decode certificate
          echo "$LINTY_APPLE_SIGNING_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERTIFICATE_PATH" -P "$LINTY_APPLE_SIGNING_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Build & notarize app
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Hari Shekhar (3RPKRQ84N3)"
          APPLE_ID: ${{ secrets.LINTY_APPLE_NOTARIZATION_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.LINTY_APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.LINTY_APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.LINTY_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.LINTY_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Tauri's bundle_dmg.sh (hdiutil + Finder) fails intermittently on hosted
          # macOS runners after the app has already been signed and notarized
          # (e.g. runs 34694558903, 34873986016). Cargo output is cached within
          # the job, so a retry only re-signs, re-notarizes and re-bundles.
          for attempt in 1 2 3; do
            if yarn tauri build --target universal-apple-darwin --bundles dmg,app --features local-stt,parakeet; then
              exit 0
            fi
            echo "::warning::tauri build failed (attempt $attempt/3); retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Notarize & staple DMG
        env:
          APPLE_ID: ${{ secrets.LINTY_APPLE_NOTARIZATION_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.LINTY_APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.LINTY_APPLE_TEAM_ID }}
        run: |
          xcrun lipo src-tauri/target/universal-apple-darwin/release/bundle/macos/Linty.app/Contents/MacOS/linty -verify_arch arm64 x86_64
          DMG_PATH=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          echo "Notarizing DMG: $DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          echo "DMG notarized and stapled."

          # Keep a versioned installer plus an identical stable download alias.
          VERSION="${{ steps.version.outputs.version }}"
          cp "$DMG_PATH" "$(dirname "$DMG_PATH")/linty.dmg"
          mv "$DMG_PATH" "$(dirname "$DMG_PATH")/linty-${VERSION}.dmg"

      - name: Generate latest.json for updater
        env:
          FORCE_UPDATE: ${{ inputs.force_update }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MACOS_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"

          # Find the .app.tar.gz and .sig files generated by Tauri updater
          TAR_GZ=$(ls ${MACOS_DIR}/*.app.tar.gz 2>/dev/null | head -1)
          SIG_FILE=$(ls ${MACOS_DIR}/*.app.tar.gz.sig 2>/dev/null | head -1)

          if [ -z "$TAR_GZ" ] || [ -z "$SIG_FILE" ]; then
            echo "ERROR: Updater artifacts not found in ${MACOS_DIR}"
            ls -la ${MACOS_DIR}/ || true
            exit 1
          fi

          SIGNATURE=$(cat "$SIG_FILE")
          TAR_GZ_NAME=$(basename "$TAR_GZ")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Force update (docs/runbooks/force-update.md): copies below
          # minimum_version must install this release. Keep the minimum the
          # current latest release requires; a forced release raises it.
          PREVIOUS_MINIMUM=$(curl -fsSL --max-time 30 "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" | jq -r '.minimum_version // empty' || true)
          if [ "$FORCE_UPDATE" = "true" ]; then
            MINIMUM="$VERSION"
          else
            MINIMUM="$PREVIOUS_MINIMUM"
          fi

          jq -n \
            --arg version "v${VERSION}" \
            --rawfile notes RELEASE_NOTES.md \
            --arg pub_date "$PUB_DATE" \
            --arg signature "$SIGNATURE" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${TAR_GZ_NAME}" \
            --arg minimum "$MINIMUM" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              platforms: {"darwin-aarch64": {signature: $signature, url: $url}, "darwin-x86_64": {signature: $signature, url: $url}}}
             + (if $minimum == "" then {} else {minimum_version: $minimum} end)' > latest.json

          echo "Generated latest.json for v${VERSION}"
          cat latest.json

      - name: Preserve the exact built source for publication
        run: |
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          git diff --exit-code
          git bundle create release-source.bundle HEAD "^$GITHUB_SHA"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 — Node 24
        with:
          name: Linty-macOS-universal
          # Keep everything needed to retry publishing without another build.
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            latest.json
            RELEASE_NOTES.md
            release-source.bundle
          if-no-files-found: error

  publish-release:
    needs: [checked-source, checks, build-macos]
    # A deliberately skipped suite must not skip publication, but every other
    # failure/skip still blocks it. Manual builds always run fresh checks.
    if: >-
      ${{ !cancelled() && needs.checked-source.result == 'success' &&
          needs.build-macos.result == 'success' && !inputs.build_only &&
          (needs.checks.result == 'success' ||
           (needs.checks.result == 'skipped' && needs.checked-source.outputs.reused == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download the signed, notarized build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Linty-macOS-universal
      - name: Restore and verify the built source
        env:
          RELEASE_SHA: ${{ needs.build-macos.outputs.sha }}
          RELEASE_VERSION: ${{ needs.build-macos.outputs.version }}
        run: |
          git bundle verify release-source.bundle
          git fetch release-source.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "$RELEASE_SHA^")" = "$GITHUB_SHA"
          git checkout --detach "$RELEASE_SHA"
          test "$(jq -r .version package.json)" = "$RELEASE_VERSION"
          test "$(jq -r .version latest.json)" = "v$RELEASE_VERSION"

      - name: Tag the exact built source
        env:
          RELEASE_TAG: v${{ needs.build-macos.outputs.version }}
          RELEASE_SHA: ${{ needs.build-macos.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git tag "$RELEASE_TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 — Node 24
        with:
          tag_name: v${{ needs.build-macos.outputs.version }}
          target_commitish: ${{ needs.build-macos.outputs.sha }}
          name: Linty v${{ needs.build-macos.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: true

      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LINTY_BUNDLE_DIR: src-tauri/target/universal-apple-darwin/release/bundle
          RELEASE_TAG: v${{ needs.build-macos.outputs.version }}
        run: bash scripts/publish-release.sh "$RELEASE_TAG"
