name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: Require every older copy to install this release
        type: boolean
        default: false
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build-macos:
    needs: checks
    runs-on: macos-14 # Apple Silicon (M1) runner
    env:
      LINTY_PARAKEET_LIB_DIR: ${{ github.workspace }}/src-tauri/swift/.build/ci-prebuilt

    # Skip CI when commit message contains [skip ci]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — Node 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prepare release version
        id: version
        run: |
          VERSION=$(node scripts/prepare-release.mjs)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: release v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select Xcode (Swift 6 toolchain for the Parakeet bridge)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Identify Swift toolchain
        id: swift-toolchain
        shell: bash
        run: |
          TOOLCHAIN_HASH=$({ xcodebuild -version; xcrun swift --version; xcrun --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "hash=$TOOLCHAIN_HASH" >> "$GITHUB_OUTPUT"

      # Cache the finished static library: restoring SwiftPM's build directory
      # can still trigger a full rebuild after a fresh checkout. Only exact
      # source/dependency/toolchain/recipe matches may reuse this archive.
      - name: Swift bridge cache
        id: swift-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 — Node 24
        with:
          path: ${{ env.LINTY_PARAKEET_LIB_DIR }}/libLintyParakeet.a
          key: swift-archive-v1-${{ runner.os }}-${{ runner.arch }}-aarch64-apple-darwin-${{ steps.swift-toolchain.outputs.hash }}-${{ hashFiles('src-tauri/swift/Package.swift', 'src-tauri/swift/Package.resolved', 'src-tauri/swift/Sources/**', 'src-tauri/build.rs', '.github/workflows/build-dmg.yml') }}

      - name: Build Swift bridge on cache miss
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: |
          swift build -c release --product LintyParakeet \
            --package-path src-tauri/swift --scratch-path "$RUNNER_TEMP/linty-swift-build" \
            --disable-automatic-resolution
          SWIFT_BIN=$(swift build -c release --show-bin-path \
            --package-path src-tauri/swift --scratch-path "$RUNNER_TEMP/linty-swift-build")
          mkdir -p "$LINTY_PARAKEET_LIB_DIR"
          cp "$SWIFT_BIN/libLintyParakeet.a" "$LINTY_PARAKEET_LIB_DIR/"

      - name: Validate Swift bridge archive
        run: |
          test -s "$LINTY_PARAKEET_LIB_DIR/libLintyParakeet.a"
          xcrun lipo "$LINTY_PARAKEET_LIB_DIR/libLintyParakeet.a" -verify_arch arm64

      # Save as soon as compilation succeeds, even if a later network upload
      # or notarization fails. A subsequent run can still reuse this work.
      - name: Save Swift bridge cache
        if: steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 — Node 24
        with:
          path: ${{ env.LINTY_PARAKEET_LIB_DIR }}/libLintyParakeet.a
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: macos-aarch64
          cache-on-failure: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 — Node 24
        with:
          node-version: 24
          cache: yarn

      - name: Install yarn dependencies
        run: yarn install --frozen-lockfile

      - name: Verify the versioned release source
        run: |
          yarn test
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features local-stt,parakeet

      - name: Import Apple certificate
        env:
          LINTY_APPLE_SIGNING_CERTIFICATE: ${{ secrets.LINTY_APPLE_SIGNING_CERTIFICATE }}
          LINTY_APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.LINTY_APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          # Decode certificate
          echo "$LINTY_APPLE_SIGNING_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERTIFICATE_PATH" -P "$LINTY_APPLE_SIGNING_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Build & notarize app
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Hari Shekhar (3RPKRQ84N3)"
          APPLE_ID: ${{ secrets.LINTY_APPLE_NOTARIZATION_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.LINTY_APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.LINTY_APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.LINTY_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.LINTY_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Tauri's bundle_dmg.sh (hdiutil + Finder) fails intermittently on hosted
          # macOS runners after the app has already been signed and notarized
          # (e.g. runs 34694558903, 34873986016). Cargo output is cached within
          # the job, so a retry only re-signs, re-notarizes and re-bundles.
          for attempt in 1 2 3; do
            if yarn tauri build --bundles dmg,app --features local-stt,parakeet; then
              exit 0
            fi
            echo "::warning::tauri build failed (attempt $attempt/3); retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Notarize & staple DMG
        env:
          APPLE_ID: ${{ secrets.LINTY_APPLE_NOTARIZATION_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.LINTY_APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.LINTY_APPLE_TEAM_ID }}
        run: |
          DMG_PATH=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          echo "Notarizing DMG: $DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          echo "DMG notarized and stapled."

          # A stable asset name makes /releases/latest/download/ a direct
          # installer link for the README and website across all versions.
          mv "$DMG_PATH" "$(dirname "$DMG_PATH")/Linty_aarch64.dmg"

      - name: Generate latest.json for updater
        env:
          FORCE_UPDATE: ${{ inputs.force_update }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MACOS_DIR="src-tauri/target/release/bundle/macos"

          # Find the .app.tar.gz and .sig files generated by Tauri updater
          TAR_GZ=$(ls ${MACOS_DIR}/*.app.tar.gz 2>/dev/null | head -1)
          SIG_FILE=$(ls ${MACOS_DIR}/*.app.tar.gz.sig 2>/dev/null | head -1)

          if [ -z "$TAR_GZ" ] || [ -z "$SIG_FILE" ]; then
            echo "ERROR: Updater artifacts not found in ${MACOS_DIR}"
            ls -la ${MACOS_DIR}/ || true
            exit 1
          fi

          SIGNATURE=$(cat "$SIG_FILE")
          TAR_GZ_NAME=$(basename "$TAR_GZ")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Force update (docs/runbooks/force-update.md): copies below
          # minimum_version must install this release. Keep the minimum the
          # current latest release requires; a forced release raises it.
          PREVIOUS_MINIMUM=$(curl -fsSL --max-time 30 "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" | jq -r '.minimum_version // empty' || true)
          if [ "$FORCE_UPDATE" = "true" ]; then
            MINIMUM="$VERSION"
          else
            MINIMUM="$PREVIOUS_MINIMUM"
          fi

          jq -n \
            --arg version "v${VERSION}" \
            --rawfile notes RELEASE_NOTES.md \
            --arg pub_date "$PUB_DATE" \
            --arg signature "$SIGNATURE" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${TAR_GZ_NAME}" \
            --arg minimum "$MINIMUM" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}
             + (if $minimum == "" then {} else {minimum_version: $minimum} end)' > latest.json

          echo "Generated latest.json for v${VERSION}"
          cat latest.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 — Node 24
        with:
          name: Linty-macOS-arm64
          # Keep everything needed to retry publishing without another build.
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            latest.json
            RELEASE_NOTES.md
          if-no-files-found: error

      - name: Tag the exact built source
        env:
          RELEASE_TAG: v${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git tag "$RELEASE_TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 — Node 24
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.version.outputs.sha }}
          name: Linty v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: true

      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: bash scripts/publish-release.sh "$RELEASE_TAG"
