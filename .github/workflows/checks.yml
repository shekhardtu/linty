name: Checks

on:
  # Releases reuse a successful PR suite when its tested tree matches main.
  # workflow_call provides full validation when that cannot be verified.
  workflow_call:
    inputs:
      full_validation:
        description: Require the full suite when called for release validation
        type: boolean
        default: true
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Select check scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORCE_FULL: ${{ inputs.full_validation }}
        run: node scripts/check-scope.mjs

  website-tests:
    name: Website checks
    needs: changes
    if: needs.changes.outputs.scope == 'website'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      # The static website tests use Node's built-ins; no app dependencies/build.
      - run: node --test tests/website-*.test.mjs tests/privacy.test.mjs tests/check-scope.test.mjs
      - name: Check website JavaScript syntax
        run: |
          for script in website/*.js scripts/capture-website.mjs scripts/website-preview-data.mjs; do
            node --check "$script"
          done

  public-corpus-tests:
    name: Public corpus scoring and loader
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/benchmarks/public-requirements.txt
      - run: python -m pip install -r scripts/benchmarks/public-requirements.txt
      - run: python -m unittest discover -s tests -p public_corpus_test.py -v

  rust-logging:
    name: Rust logging hygiene
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — Node 24
      - name: No print macros in app code
        run: scripts/check-rust-logging.sh

  node-tests:
    name: Node tests
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — Node 24
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 — Node 24
        with:
          node-version: 24
          cache: yarn
      # No install scripts: nothing here needs native builds.
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn test
      - run: yarn build
      - run: yarn audit
      - run: python3 scripts/third-party-notices.py --check

  native-tests:
    name: macOS native tests (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: '1'
      LINTY_PARAKEET_LIB_DIR: ${{ github.workspace }}/src-tauri/swift/.build/ci-prebuilt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Restore or build Swift bridge
        if: matrix.arch == 'arm64'
        id: swift-bridge
        uses: ./.github/actions/swift-bridge
      - name: Identify Rust compiler
        id: rust-compiler
        run: echo "hash=$(rustc -vV | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore incremental native build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Keep workspace objects and incremental state. rust-cache's default
          # cleanup discards these and disables incremental compilation.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target/debug
            src-tauri/target/.rustc_info.json
            src-tauri/swift/.build/ci-tests
          key: native-incremental-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-compiler.outputs.hash }}-${{ steps.swift-bridge.outputs.toolchain-hash }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-${{ hashFiles('src-tauri/src/**', 'src-tauri/tests/**', 'src-tauri/build.rs', 'src-tauri/tauri.conf.json', 'src-tauri/capabilities/**', 'src-tauri/permissions/**', 'src-tauri/icons/**', 'src-tauri/licenses/**', 'src-tauri/swift/Package.*', 'src-tauri/swift/Sources/**', 'src-tauri/swift/Tests/**', 'src/**', 'public/**', 'package.json', 'yarn.lock', 'RELEASE_NOTES.md', 'vite.config.*', '.github/workflows/checks.yml', '.github/actions/swift-bridge/action.yml') }}
          restore-keys: |
            native-incremental-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-compiler.outputs.hash }}-${{ steps.swift-bridge.outputs.toolchain-hash }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-
            native-incremental-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-compiler.outputs.hash }}-${{ steps.swift-bridge.outputs.toolchain-hash }}-
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features local-stt,parakeet
      - name: Build native application with production assets
        run: node node_modules/@tauri-apps/cli/tauri.js build --debug --no-bundle --features local-stt,parakeet
      - run: swift test --package-path src-tauri/swift --scratch-path src-tauri/swift/.build/ci-tests --disable-automatic-resolution
        if: matrix.arch == 'arm64'
      - run: python3 tests/supervisor.test.py
      - run: python3 scripts/check-rust-advisories.py

  ui-tests:
    name: UI tests (${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn playwright install --with-deps ${{ matrix.browser }}
      - run: yarn build
      - run: yarn test:security
        env:
          UI_BROWSER: ${{ matrix.browser }}
      - run: yarn test:ui
        env:
          UI_BROWSER: ${{ matrix.browser }}
      - run: yarn test:onboarding
        env:
          UI_BROWSER: ${{ matrix.browser }}
      - run: yarn test:audio-history
        env:
          UI_BROWSER: ${{ matrix.browser }}
      - run: yarn test:correction-feedback
        env:
          UI_BROWSER: ${{ matrix.browser }}
      - run: yarn test:updates
        env:
          UI_BROWSER: ${{ matrix.browser }}
      - run: yarn test:privacy
        env:
          UI_BROWSER: ${{ matrix.browser }}
      - run: yarn test:microphone
        env:
          UI_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: ui-failure-${{ matrix.browser }}
          path: artifacts/

  required-checks:
    name: Required checks
    if: always()
    needs: [changes, website-tests, public-corpus-tests, rust-logging, node-tests, native-tests, ui-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Require every selected check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-scope.mjs --verify-results
      - name: Record the commit that passed all checks
        if: github.event_name == 'pull_request' && needs.changes.outputs.scope == 'full'
        env:
          CHECKED_COMMIT: ${{ github.sha }}
        run: printf '%s\n' "$CHECKED_COMMIT" > "$RUNNER_TEMP/checked-commit.txt"
      - name: Save checked source for release validation
        if: github.event_name == 'pull_request' && needs.changes.outputs.scope == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checked-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checked-commit.txt
          retention-days: 7
          if-no-files-found: error
