name: Checks

on:
  # Releases reuse a successful PR suite when its tested tree matches main.
  # workflow_call provides full validation when that cannot be verified.
  workflow_call:
    inputs:
      full_validation:
        description: Require the full suite when called for release validation
        type: boolean
        default: true
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Select check scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORCE_FULL: ${{ inputs.full_validation }}
        run: node scripts/check-scope.mjs

  website-tests:
    name: Website and documentation checks
    needs: changes
    if: needs.changes.outputs.scope == 'website'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      # Website and documentation checks use Node built-ins; no app install/build.
      - run: node --test tests/website-*.test.mjs tests/privacy.test.mjs tests/check-scope.test.mjs
      - name: Check website JavaScript syntax
        run: |
          for script in website/*.js scripts/capture-website.mjs scripts/website-preview-data.mjs; do
            node --check "$script"
          done

  public-corpus-tests:
    name: Public corpus scoring and loader
    needs: changes
    if: needs.changes.outputs.scope == 'full' || needs.changes.outputs.scope == 'native'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/benchmarks/public-requirements.txt
      - run: python -m pip install -r scripts/benchmarks/public-requirements.txt
      - run: python -m unittest discover -s tests -p public_corpus_test.py -v

  native-checks:
    name: Native source and security checks
    needs: changes
    if: needs.changes.outputs.scope == 'full' || needs.changes.outputs.scope == 'native'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — Node 24
      # Rust/Swift compilation and native tests run in the local release flow.
      # These checks inspect source and dependency metadata without building.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: No print macros in app code
        run: scripts/check-rust-logging.sh
      - run: python3 tests/supervisor.test.py
      - run: python3 scripts/check-rust-advisories.py

  node-tests:
    name: Node tests
    needs: changes
    if: needs.changes.outputs.scope == 'full' || needs.changes.outputs.scope == 'native' || needs.changes.outputs.scope == 'app' || needs.changes.outputs.scope == 'node'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — Node 24
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 — Node 24
        with:
          node-version: 24
          cache: yarn
      # No install scripts: nothing here needs native builds.
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn test
      - name: Check website JavaScript syntax
        run: |
          for script in website/*.js scripts/capture-website.mjs scripts/website-preview-data.mjs; do
            node --check "$script"
          done
      - run: yarn build
      - run: yarn audit
      - run: python3 scripts/third-party-notices.py --check

  ui-tests:
    name: UI tests (webkit)
    needs: changes
    if: needs.changes.outputs.scope == 'full' || needs.changes.outputs.scope == 'app'
    runs-on: ubuntu-latest
    # Linty's macOS webview uses WebKit; avoid duplicate Chromium runner time.
    env:
      UI_BROWSER: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn playwright install --with-deps webkit
      - run: yarn build
      - run: yarn test:browsers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: ui-failure-webkit
          path: artifacts/

  required-checks:
    name: Required checks
    if: always()
    needs: [changes, website-tests, public-corpus-tests, native-checks, node-tests, ui-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Require every selected check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-scope.mjs --verify-results
      - name: Record the commit that passed all checks
        if: github.event_name == 'pull_request' && needs.changes.outputs.scope == 'full'
        env:
          CHECKED_COMMIT: ${{ github.sha }}
        run: printf '%s\n' "$CHECKED_COMMIT" > "$RUNNER_TEMP/checked-commit.txt"
      - name: Save checked source for release validation
        if: github.event_name == 'pull_request' && needs.changes.outputs.scope == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checked-commit.txt
          retention-days: 7
          if-no-files-found: error
