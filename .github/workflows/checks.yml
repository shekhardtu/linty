name: Checks

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-corpus-tests:
    name: Public corpus scoring and loader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/benchmarks/public-requirements.txt
      - run: python -m pip install -r scripts/benchmarks/public-requirements.txt
      - run: python -m unittest discover -s tests -p public_corpus_test.py -v

  rust-logging:
    name: Rust logging hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — Node 24
      - name: No print macros in app code
        run: scripts/check-rust-logging.sh

  node-tests:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — Node 24
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 — Node 24
        with:
          node-version: 24
          cache: yarn
      # No install scripts: nothing here needs native builds.
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn test
      - run: yarn build
      - run: yarn audit
      - run: python3 scripts/third-party-notices.py --check

  native-tests:
    name: macOS native tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: macos-native-tests
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features local-stt,parakeet
      - name: Build native application with production assets
        run: node node_modules/@tauri-apps/cli/tauri.js build --debug --no-bundle --features local-stt,parakeet
      - run: swift test --package-path src-tauri/swift --disable-automatic-resolution
      - run: python3 tests/supervisor.test.py
      - run: python3 scripts/check-rust-advisories.py

  ui-tests:
    name: UI tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn playwright install --with-deps ${{ matrix.browser }}
      - run: yarn build
      - run: yarn test:security
        env:
          UI_BROWSER: ${{ matrix.browser }}
      - run: yarn test:ui
        env:
          UI_BROWSER: ${{ matrix.browser }}
      - run: yarn test:audio-history
        env:
          UI_BROWSER: ${{ matrix.browser }}
      - run: yarn test:correction-feedback
        env:
          UI_BROWSER: ${{ matrix.browser }}
      - run: yarn test:updates
        env:
          UI_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: ui-failure-${{ matrix.browser }}
          path: artifacts/

  required-checks:
    name: Required checks
    if: always()
    needs: [public-corpus-tests, rust-logging, node-tests, native-tests, ui-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
