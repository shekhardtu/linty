name: Feature request
description: Suggest a focused improvement to Linty.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the task or difficulty in your workflow.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
      description: Explain your preferred solution and any alternatives you have tried.
    validations:
      required: true
